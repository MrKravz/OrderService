server:
  port: 8083
spring:
  application:
    name: "OrderService"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_DOCKER_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        show_sql: "true"
resilience4j.circuitbreaker:
  instances:
    userService:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 10000
resilience4j.retry:
  instances:
    userService:
      maxAttempts: 5
      waitDuration: 500ms
      retryExceptions:
        - by.ares.orderservice.exception.ExternalApiException
resilience4j.bulkhead:
  instances:
    userService:
      maxConcurrentCalls: 5
api:
  user:
    uri: ${USER_SERVICE_URL:}